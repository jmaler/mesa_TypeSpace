<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TypeSpace</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="icon" type="image/x-icon" href="./material/life/heart.png">
</head>
<body>

<!-- Creates canvas with specified margines -->
<canvas id="canV" width=1920 height=1080></canvas>

<!-- Hidden input for mobile keyboard -->
<input type="text" id="mobileInput" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false">

<!-- Start Screen Overlay -->
<div id="startScreen" class="start-overlay">
    <div class="start-content">
        <h1>TYPESPACE</h1>
        <div class="instructions">
            <p>Type the words on asteroids to destroy them</p>
            <p>Press <strong>ENTER</strong> or <strong>SPACE</strong> to destroy word you typed</p>
            <p>Press <strong>BACKSPACE</strong> to delete last character</p>
            <p>Don't let asteroids reach your ship!</p>
            <p>Collect <span class="heart">&#9829;</span> hearts for bonus lives</p>
            <p class="mobile-hint">On mobile: tap the screen to show keyboard</p>
        </div>
        <button id="startBtn">START GAME</button>
    </div>
</div>

<!-- Game Over Overlay -->
<div id="gameOverScreen" class="game-over-overlay" style="display: none;">
    <div class="game-over-content">
        <h1>GAME OVER</h1>
        <p id="finalScore">Score: 0</p>
        <button id="playAgainBtn">Play Again</button>
    </div>
</div>

<!-- Mesa SDK -->
<script src="sdk/mesa-sdk.js"></script>

<!-- Loads and runs javascript file "index.js" -->
<script type="module" src="index.js">

</script>

</body>
</html>
